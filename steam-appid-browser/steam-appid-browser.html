<!--
regex:
 in:
  (.*)
 out:
  <li><a target="_blank" href="https://store.steampowered.com/app/$1"><img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/$1/header.jpg">$1</a></li>
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steam App List</title>
    <style>
      :root {
        --cover-w: 18vw;
        --cover-h: calc(var(--cover-w) * 215 / 460);
      }
      body {
        background: #2c323a;
      }
      ul {
        display: grid;
        gap: 8px;
        grid-auto-rows: calc(var(--cover-h) + 16px);
        grid-template-columns: repeat(auto-fill, var(--cover-w));
        justify-content: center;
        padding: 0;
      }
      li {
        list-style: none;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      a {
        color: white;
        text-align: center;
        text-decoration: none;
      }
      img {
        height: var(--cover-h);
        width: var(--cover-w);
        background: #fff2;
      }
    </style>
  </head>
  <body>
    <ul id="output"></ul>

    <script>
      const systemAppIds = ['2371090', '241100', '7', '760'];

      let appIds = [''];

      appIds = appIds.filter((appId) => /^\d+$/.test(appId));
      appIds = appIds.filter((appId) => !systemAppIds.includes(appId));

      function generateAppList(appIds) {
        const container = document.getElementById('output');

        appIds.forEach((appId) => {
          const listItem = document.createElement('li');

          const anchor = document.createElement('a');
          anchor.href = `https://store.steampowered.com/app/${appId}`;
          anchor.target = '_blank';

          const img = document.createElement('img');
          img.src = `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${appId}/header.jpg`;

          anchor.appendChild(img);
          anchor.appendChild(document.createTextNode(appId));

          listItem.appendChild(anchor);

          container.appendChild(listItem);
        });
      }

      // Call the function to generate the list
      generateAppList(appIds);
    </script>
  </body>
</html>
