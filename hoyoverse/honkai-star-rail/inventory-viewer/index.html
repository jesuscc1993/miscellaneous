<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="assets/images/favicon.png" />
    <link
      rel="stylesheet"
      href="../../common/inventory-viewer/inventory-viewer.css"
    />
    <link rel="stylesheet" href="index.css" />
    <title>HSR Inventory Viewer</title>
  </head>
  <body>
    <div class="main">
      <header>
        <h1>Honkai: Star Rail - Inventory Viewer</h1>

        <span>
          ( <a href="#characters">Characters</a> /
          <a href="#weapons">Weapons</a> )
        </span>
      </header>

      <section>
        <div id="elements">
          <h2 class="no-padding-bottom">Types</h2>
          <div class="filter-section"></div>
        </div>

        <div id="types">
          <h2 class="no-padding-bottom">Paths</h2>
          <div class="filter-section"></div>
        </div>
      </section>

      <section id="characters">
        <h2>Characters</h2>
        <div class="item-section"></div>
      </section>

      <section id="weapons">
        <h2>Weapons</h2>
        <div class="item-section"></div>
      </section>

      <footer>
        <div class="footer-links">
          <a href="../../">&lt; Back to Hoyoverse</a>
        </div>
      </footer>

      <div class="back-to-top" title="Back to the top" onclick="scrollToTop()">
        <div>
          <img src="assets/images/back-to-top.png" />
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.0.slim.min.js"></script>
    <script src="data/characters.js"></script>
    <script src="data/weapons.js"></script>
    <script src="data/elements.js"></script>
    <script src="data/types.js"></script>
    <script src="index.js"></script>
    <script src="../../common/inventory-viewer/inventory-viewer.js"></script>
  </body>
</html>
