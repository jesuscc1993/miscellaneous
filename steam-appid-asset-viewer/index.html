<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steam AppID Asset Viewer</title>
    <link
      rel="shortcut icon"
      href="https://store.steampowered.com/favicon.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    style="
      background-image: url(https://cdn.cloudflare.steamstatic.com/steam/apps/70/page_bg_generated_v6b.jpg);
    "
  >
    <h1>Steam AppID Asset Viewer</h1>

    <form onsubmit="updateImages(event)">
      <label for="appIdInput">App ID</label>
      <input
        type="number"
        id="appIdInput"
        title="appId"
        value="70"
        onblur="updateImages(event)"
      />
      <button type="submit">Submit</button>

      <a
        id="storeAnchor"
        href="https://store.steampowered.com/app/70"
        target="_blank"
      >
        Store Page
      </a>
    </form>

    <div class="links-container">
      <a href="#hero">
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/library_hero.jpg"
          alt="Hero Thumbnail"
          class="thumb"
        />
        Hero
      </a>

      <a href="#header">
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/header.jpg"
          alt="Header Thumbnail"
          class="thumb"
        />
        Header
      </a>

      <a href="#capsuleHeader">
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/capsule_616x353.jpg"
          alt="Capsule Header Thumbnail"
          class="thumb"
        />
        Cap. Header
      </a>

      <a href="#capsule">
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/library_600x900.jpg"
          alt="Capsule Thumbnail"
          class="thumb"
        />
        Capsule
      </a>

      <a href="#logo">
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/logo.png"
          alt="Logo Thumbnail"
          class="thumb"
        />
        Logo
      </a>
    </div>

    <div id="hero" class="asset-group">
      <h2>Hero</h2>

      <a
        href="https://cdn.cloudflare.steamstatic.com/steam/apps/70/library_hero.jpg"
        target="_blank"
      >
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/library_hero.jpg"
          alt="Hero"
        />
      </a>
    </div>

    <div id="header" class="asset-group">
      <h2>Header</h2>

      <a
        href="https://cdn.cloudflare.steamstatic.com/steam/apps/70/header.jpg"
        target="_blank"
      >
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/header.jpg"
          alt="Header"
        />
      </a>
    </div>

    <div id="capsuleHeader" class="asset-group">
      <h2>Capsule Header</h2>

      <a
        href="https://cdn.cloudflare.steamstatic.com/steam/apps/70/capsule_616x353.jpg"
        target="_blank"
      >
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/capsule_616x353.jpg"
          alt="Capsule Header"
        />
      </a>
    </div>

    <div id="capsule" class="asset-group">
      <h2>
        Capsule (
        <a
          href="https://cdn.cloudflare.steamstatic.com/steam/apps/70/library_600x900_2x.jpg"
          target="_blank"
          >2x</a
        >
        )
      </h2>

      <a
        href="https://cdn.cloudflare.steamstatic.com/steam/apps/70/library_600x900.jpg"
        target="_blank"
      >
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/library_600x900.jpg"
          alt="Capsule"
        />
      </a>
    </div>

    <div id="logo" class="asset-group">
      <h2>
        Logo (
        <a
          href="https://cdn.cloudflare.steamstatic.com/steam/apps/70/logo_2x.png"
          target="_blank"
          >2x</a
        >
        )
      </h2>

      <a
        href="https://cdn.cloudflare.steamstatic.com/steam/apps/70/logo.png"
        target="_blank"
      >
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/logo.png"
          alt="Logo"
        />
      </a>
    </div>

    <script src="controller.js"></script>
  </body>
</html>
