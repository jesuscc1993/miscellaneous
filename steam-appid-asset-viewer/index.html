<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Image Loader</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Steam AppID Asset Viewer</h1>

    <form onsubmit="updateImages(event)">
      <label for="appIdInput">App ID</label>
      <input type="number" id="appIdInput" title="appId" value="70" />
      <button type="submit">Submit</button>
    </form>

    <div class="links-container">
      <a href="#hero">Hero</a>
      <a href="#header">Header</a>
      <a href="#capsule">Capsule</a>
      <a href="#logo">Logo</a>
    </div>

    <div id="hero" class="asset-group">
      <h2>Hero</h2>

      <img
        id="heroImg"
        src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/library_hero.jpg"
        alt="Hero"
      />
    </div>

    <div id="header" class="asset-group">
      <h2>Header</h2>

      <img
        id="headerImg"
        src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/header.jpg"
        alt="Header"
      />
    </div>

    <div id="capsule" class="asset-group">
      <h2>Capsule</h2>

      <img
        id="capsuleImg"
        src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/library_600x900_2x.jpg"
        alt="Capsule"
      />
    </div>

    <div id="logo" class="asset-group">
      <h2>Logo</h2>

      <img
        id="logoImg"
        src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/logo_2x.png"
        alt="Logo"
      />
    </div>

    <script src="controller.js"></script>
  </body>
</html>
