<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steam AppID Asset Viewer</title>
    <link
      rel="shortcut icon"
      href="https://store.steampowered.com/favicon.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Steam AppID Asset Viewer</h1>

    <form onsubmit="updateImages(event)">
      <label for="appIdInput">App ID</label>
      <input
        type="number"
        id="appIdInput"
        title="appId"
        value="70"
        onblur="updateImages(event)"
      />
      <button type="submit">Submit</button>
    </form>

    <div class="links-container">
      <a href="#hero">Hero</a>
      <a href="#header">Header</a>
      <a href="#capsule">Capsule</a>
      <a href="#logo">Logo</a>
    </div>

    <div id="hero" class="asset-group">
      <h2>Hero</h2>

      <a
        href="https://cdn.cloudflare.steamstatic.com/steam/apps/70/library_hero.jpg"
        target="_blank"
      >
        <img
          id="heroImg"
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/library_hero.jpg"
          alt="Hero"
        />
      </a>
    </div>

    <div id="header" class="asset-group">
      <h2>Header</h2>

      <a
        href="https://cdn.cloudflare.steamstatic.com/steam/apps/70/header.jpg"
        target="_blank"
      >
        <img
          id="headerImg"
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/header.jpg"
          alt="Header"
        />
      </a>
    </div>

    <div id="capsule" class="asset-group">
      <h2>Capsule</h2>

      <a
        href="https://cdn.cloudflare.steamstatic.com/steam/apps/70/library_600x900_2x.jpg"
        target="_blank"
      >
        <img
          id="capsuleImg"
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/library_600x900_2x.jpg"
          alt="Capsule"
        />
      </a>
    </div>

    <div id="logo" class="asset-group">
      <h2>Logo</h2>

      <a
        href="https://cdn.cloudflare.steamstatic.com/steam/apps/70/logo_2x.png"
        target="_blank"
      >
        <img
          id="logoImg"
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/70/logo_2x.png"
          alt="Logo"
        />
      </a>
    </div>

    <div>
      <h2>Other</h2>

      <a
        id="storeAnchor"
        href="https://store.steampowered.com/app/70"
        target="_blank"
        >Store Page</a
      >
    </div>

    <script src="controller.js"></script>
  </body>
</html>
