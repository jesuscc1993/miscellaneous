<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Font Comparer</title>
  </head>
  <body>
    <h1>Font Comparer</h1>

    <div class="form">
      <div class="form-group">
        <label for="fontSizeInput">Font Size:</label>
        <input
          type="number"
          id="fontSizeInput"
          oninput="updateFontSizes(this.value)"
        />
        <button type="button" onclick="resetFontSizes()">Reset</button>
      </div>

      <div class="form-group">
        <label for="fontFamilyInput1">Font Family 1:</label>
        <input
          type="text"
          id="fontFamilyInput1"
          value="sans-serif"
          oninput="updateFontFamily('textInput', this.value)"
        />
      </div>

      <div class="form-group">
        <label for="fontFamilyInput2">Font Family 2:</label>
        <input
          type="text"
          id="fontFamilyInput2"
          value="serif"
          oninput="updateFontFamily('textOutput1', this.value)"
        />
      </div>

      <div class="form-group">
        <label for="fontFamilyInput3">Font Family 3:</label>
        <input
          type="text"
          value="monospace"
          id="fontFamilyInput3"
          oninput="updateFontFamily('textOutput2', this.value)"
        />
      </div>

      <div class="form-group">
        <label for="textInput">Input Text:</label>
        <textarea
          id="textInput"
          rows="4"
          onkeyup="updateInputs(this.value)"
        ></textarea>
        <button type="button" onclick="resetText()">Reset</button>
      </div>

      <div class="form-group">
        <label for="textOutput1">Font 1:</label>
        <textarea id="textOutput1" rows="4" readonly></textarea>
      </div>

      <div class="form-group">
        <label for="textOutput2">Font 2:</label>
        <textarea id="textOutput2" rows="4" readonly></textarea>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
