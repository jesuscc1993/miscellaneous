<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Steam AppID Asset Viewer</title>
    <link
      rel="shortcut icon"
      href="https://store.steampowered.com/favicon.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Steam AppID Asset Viewer</h1>

    <form onsubmit="updateImages(event)">
      <label for="appIdInput">App ID</label>
      <input
        type="number"
        id="appIdInput"
        title="appId"
        onblur="updateImages(event)"
      />
      <button type="submit">Submit</button>

      <a
        id="storeAnchor"
        href="https://store.steampowered.com/app/1"
        target="_blank"
      >
        Store Page
      </a>
    </form>

    <div class="links-container">
      <a href="#capsuleVertical" title="Capsule (Vertical)">
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/1/library_600x900.jpg"
          alt="Capsule (Vertical) Thumbnail"
          class="thumb"
        />
        Capsule (V)
      </a>

      <a href="#capsuleHorizontal" title="Capsule (Horizontal)">
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/1/capsule_616x353.jpg"
          alt="Capsule (Horizontal) Thumbnail"
          class="thumb"
        />
        Capsule (H)
      </a>

      <a href="#header">
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/1/header.jpg"
          alt="Header Thumbnail"
          class="thumb"
        />
        Header
      </a>

      <a href="#capsuleS">
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/1/capsule_231x87.jpg"
          alt="Capsule (231x87)"
          class="thumb"
        />
        Capsule (S)
      </a>

      <a href="#capsuleXS">
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/1/capsule_184x69.jpg"
          alt="Capsule (184x69)"
          class="thumb"
        />
        Capsule (XS)
      </a>

      <a href="#hero">
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/1/library_hero.jpg"
          alt="Hero Thumbnail"
          class="thumb"
        />
        Hero
      </a>

      <a href="#logo">
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/1/logo.png"
          alt="Logo Thumbnail"
          class="thumb"
        />
        Logo
      </a>

      <a href="#bg">
        <img
          src="https://cdn.steamstatic.com/steam/apps/1/page_bg_raw.jpg"
          alt="Background Thumbnail"
          class="thumb"
        />
        Background
      </a>
    </div>

    <div id="capsuleVertical" class="asset-group">
      <h2>
        Capsule (300x450) [
        <a
          href="https://cdn.cloudflare.steamstatic.com/steam/apps/1/library_600x900_2x.jpg"
          target="_blank"
          >2x</a
        >
        ]
      </h2>

      <a
        href="https://cdn.cloudflare.steamstatic.com/steam/apps/1/library_600x900.jpg"
        target="_blank"
      >
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/1/library_600x900.jpg"
          alt="Capsule"
        />
      </a>
    </div>

    <div id="capsuleHorizontal" class="asset-group">
      <h2>Capsule (616x353)</h2>

      <a
        href="https://cdn.cloudflare.steamstatic.com/steam/apps/1/capsule_616x353.jpg"
        target="_blank"
      >
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/1/capsule_616x353.jpg"
          alt="Capsule Header"
        />
      </a>
    </div>

    <div id="header" class="asset-group">
      <h2>Header (460x215)</h2>

      <a
        href="https://cdn.cloudflare.steamstatic.com/steam/apps/1/header.jpg"
        target="_blank"
      >
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/1/header.jpg"
          alt="Header"
        />
      </a>
    </div>

    <div class="flex justify-center">
      <div id="capsuleS" class="asset-group">
        <h2>Capsule (231x87)</h2>

        <a
          href="https://cdn.cloudflare.steamstatic.com/steam/apps/268910/capsule_231x87.jpg"
          target="_blank"
        >
          <img
            src="https://cdn.cloudflare.steamstatic.com/steam/apps/268910/capsule_231x87.jpg"
            alt="Capsule Header"
          />
        </a>
      </div>

      <div id="capsuleXS" class="asset-group">
        <h2>Capsule (184x69)</h2>

        <a
          href="https://cdn.cloudflare.steamstatic.com/steam/apps/268910/capsule_184x69.jpg"
          target="_blank"
        >
          <img
            src="https://cdn.cloudflare.steamstatic.com/steam/apps/268910/capsule_184x69.jpg"
            alt="Capsule Header"
          />
        </a>
      </div>
    </div>

    <div id="hero" class="asset-group">
      <h2>Hero (1920x620)</h2>

      <a
        href="https://cdn.cloudflare.steamstatic.com/steam/apps/1/library_hero.jpg"
        target="_blank"
      >
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/1/library_hero.jpg"
          alt="Hero"
        />
      </a>
    </div>

    <div id="logo" class="asset-group">
      <h2>
        Logo [
        <a
          href="https://cdn.cloudflare.steamstatic.com/steam/apps/1/logo_2x.png"
          target="_blank"
          >2x</a
        >
        ]
      </h2>

      <a
        href="https://cdn.cloudflare.steamstatic.com/steam/apps/1/logo.png"
        target="_blank"
      >
        <img
          src="https://cdn.cloudflare.steamstatic.com/steam/apps/1/logo.png"
          alt="Logo"
        />
      </a>
    </div>

    <div id="bg" class="asset-group">
      <h2>
        Background [
        <a
          href="https://cdn.steamstatic.com/steam/apps/1/page_bg_generated_v6b.jpg"
          target="_blank"
          >tinted</a
        >
        ]
      </h2>

      <a
        href="https://cdn.steamstatic.com/steam/apps/1/page_bg_raw.jpg"
        target="_blank"
      >
        <img
          src="https://cdn.steamstatic.com/steam/apps/1/page_bg_raw.jpg"
          alt="Background"
        />
      </a>
    </div>

    <script src="controller.js"></script>
  </body>
</html>
